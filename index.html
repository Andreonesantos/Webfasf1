<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>soma numeros</h1>
     <p id = "resultado"></p>
    <script>
               var numl = parseFloat(prompt("digite o numero 01"));
        var num2 = parseFloat(prompt("digite o numero 02"));
        var confirma = confirm("deseja realizar a soma de " +numl+ "+" +num2+ ":" );

        if(confirma){

        var soma = numl + num2;
        document.getElementById("resultado").innertext = "A Soma é:" +soma;

        }
        
        else{ 
            document.getElementById("resultado").innertext = "calculo não realizado";

    }

     </script>
    
</body>
</html>
